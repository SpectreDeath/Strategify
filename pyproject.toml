[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategify"
version = "0.5.0"
description = "Python framework for geopolitical simulations using agent-based modeling, game theory, and geospatial data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "SpectreDeath", email = "spectredeath@github.com"},
]
keywords = ["geopolitical-simulation", "agent-based-modeling", "game-theory", "mesa", "osint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "mesa==2.3.4",
    "mesa-geo>=0.6.0",
    "nashpy>=0.0.43",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "networkx>=3.2",
    "axelrod>=4.14",
    "libpysal>=4.8",
    "esda>=2.5",
    "vaderSentiment>=3.3",
    "folium>=0.15",
    "pyvis>=0.3",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "em-cubed @ git+https://github.com/SpectreDeath/Em-Cubed.git@master",
]

[project.optional-dependencies]
analysis = [
    "statsmodels>=0.14",
    "SALib>=1.4",
    "cdlib>=0.3",
    "pymoo>=0.6",
]
rl = [
    "pettingzoo>=1.24",
    "gymnasium>=1.0",
]
web = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
    "ruff>=0.9.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
]
logic = [
    "pyswip>=0.2",
    "memtext @ git+https://github.com/SpectreDeath/Memtext.git",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
strategify = "strategify.sim.run_mesa_geo_server:main"
strategify-dashboard = "strategify.web.dashboard:run_dashboard"
strategify-scenario = "strategify.config.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=strategify --cov-report=term-missing --cov-fail-under=80 --timeout=20"
filterwarnings = [
    "ignore::DeprecationWarning:mesa.*:",
    "ignore::DeprecationWarning:libpysal.*:",
    "ignore::FutureWarning:geopandas.*:",
]

[tool.coverage.run]
source = ["strategify"]
omit = [
    "*/sim/run_mesa_server.py",
    "*/sim/run_mesa_geo_server.py",
    "*/web/dashboard.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["*.py", "*.pyi", "pyproject.toml"]


[tool.ruff.format]
line-ending = "lf"



[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RSE", "TRY", "PL", "PERF", "N"]
ignore = [
    # Line length handled by black / formatter
    "E501",
    # Forward-reference issues in complex modules
    "F821",
    # Whitespace — handled by formatter
    "W293",
    # Magic value comparisons — common in simulation/game-theory code
    "PLR2004",
    # Argument count — legitimate in ABM constructors
    "PLR0913", "PLR0917",
    # Exception message style — project choice
    "TRY003", "TRY300",
    # Top-level imports — lazy imports used intentionally in some modules
    "PLC0415",
    # Naming — simulation code uses domain-conventional names (A, B matrices etc.)
    "N802", "N803", "N806",
    # Global statement — used in Mesa model initialization
    "PLW0603",
    # Performance suggestions — not critical for simulation
    "PERF102",
    # Complexity — simulation/game-theory code is legitimately complex
    "PLR0915", "PLR0912", "PLR0911",
    # Unused loop variable — common in iteration boilerplate
    "B007",
    # Set/dict comprehension edge cases
    "PLW0108",
    # Exception chaining — project choice
    "B904", "N999",
    # List comprehension style — readability preference
    "PERF401", "PLW2901",
    # Ternary vs if-else — readability preference
    "SIM108",
    # Nested if collapsing — not always clearer
    "SIM102",
    # Use contextlib.suppress — project choice
    "SIM105",
    # Dict/set membership style
    "SIM118", "SIM103", "SIM114",
    # Exception handling style
    "TRY004", "TRY400", "TRY201",
    # Stacklevel for warnings — not always needed
    "B028",
    # UP035/UP006 — Optional/Union compat kept for mesa type stubs
    "UP035", "UP006",
    # Dict/list constructors
    "C408", "C416",
    # Module-level import not at top — lazy imports used intentionally
    "E402",
    # sys.exit — used intentionally in CLI
    "PLR1722",
    # Generator/set comprehension style
    "C401", "C414",
    # subprocess without shell — project choice
    "PLW1510",
    # Membership test simplification
    "PLR1714",
    # Dict iteration items
    "PLC0206",
    # NOTE: F401 (unused imports), F841 (unused vars), UP007 (X|Y unions) are now ENABLED
    # Run `ruff check --fix strategify/` to auto-fix these
]
exclude = [
    "strategify/viz/dashboard.py",
    "strategify/viz/timeline.py",
    ".kilo",
    ".context",
    ".venv",
]







[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mesa.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mesa_geo.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "geopandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "libpysal.*"
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["strategify*"]

[tool.bandit]
targets = ["strategify"]
exclude = ["tests/", "*/test_*"]
detail = true

[tool.bandit.messages]
desc = "Bandit security warning"
